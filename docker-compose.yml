version: '3.8'

services:
  erp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modular_mobile_erp
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=erp_secure_docker_production_jwt_key_2026_salt12
      - CORS_ORIGIN=*
      - DATABASE_PATH=/app/server/data/erp.db
      - BACKUP_DIR=/app/server/backups
    volumes:
      - erp-data:/app/server/data
      - erp-backups:/app/server/backups

volumes:
  erp-data:
  erp-backups:
